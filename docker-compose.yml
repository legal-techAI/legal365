services:
  backend:
    build: ./backend
    restart: unless-stopped
    networks: [demo]
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    networks: [demo]
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend,backend]
    networks: [demo]
networks:
  demo:
    driver: bridge
